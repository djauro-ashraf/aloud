name: aloud
description: >-
  Aloud — listen to anything. A text-to-speech reader for books, PDFs, web
  novels and comics with natural voices, smart text clean-up and offline use.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.3
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Domain logic (pure Dart, unit-tested separately).
  aloud_core:
    path: packages/aloud_core

  # State management, DI and routing.
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0

  # Storage.
  sembast: ^3.8.0
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ">=9.2.0 <12.0.0"
  crypto: ^3.0.3

  # Documents.
  archive: ^4.0.0
  xml: ">=6.5.0 <8.0.0"
  html: ^0.15.4
  http: ^1.2.0
  pdfrx: ">=2.0.0 <4.0.0"
  file_picker: ^13.0.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0

  # Speech and audio.
  flutter_tts: ^4.2.0
  just_audio: ^0.10.0
  audio_service: ^0.18.15
  audio_session: ^0.2.0
  sherpa_onnx: ">=1.12.0 <2.0.0"
  google_mlkit_text_recognition: ">=0.14.0 <2.0.0"
  google_mlkit_translation: ">=0.13.0 <2.0.0"

  # UX helpers.
  scrollable_positioned_list: ^0.3.8
  wakelock_plus: ">=1.2.0 <2.0.0"
  permission_handler: ">=11.0.0 <14.0.0"

  material_ui: ^1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
